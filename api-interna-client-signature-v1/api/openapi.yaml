openapi: 3.0.1
info:
  contact:
    email: firma@fundaciobit.org
    name: Departament de Govern Digital a la Fundació Bit
    url: https://governdigital.fundaciobit.org
  description: "Conjunt de Serveis REST de PortaFIB per atendre peticions de firma\
    \ en servidor, firma web síncrona, firma web asíncrona, validació de firma i plantilla\
    \ de flux de firma."
  license:
    name: European Union Public Licence (EUPL v1.2)
    url: https://joinup.ec.europa.eu/sites/default/files/custom-page/attachment/eupl_v1.2_es.pdf
  title: API Interna de PortaFIB que ofereix serveis associats amb la firma digital
  version: 1.0-SNAPSHOT
externalDocs:
  description: Manual d'usuari Signature v1 (Ús i Guia de Migració des d'APIsIB)
  url: https://github.com/GovernIB/portafib/blob/portafib-3.0/doc/Manual_de_Migraci%C3%B3_de_APIsIB_a_Api_Interna.odt
servers:
- url: /portafibapi/interna
- url: http://localhost:8080/portafibapi/interna
- url: https://dev.caib.es/portafibapi/interna
- url: https://proves.caib.es/portafibapi/interna
- url: https://se.caib.es/portafibapi/interna
- url: https://www.caib.es/portafibapi/interna
tags:
- description: "Firma Web Asincrona Swagger v1. API Interna de PortaFIB que ofereix\
    \ serveis de firma web de forma asíncrona (també anomenada diferida)  incloent\
    \ múltiples firmants, annexes, fluxos, revisors, ..."
  name: AsyncSignatureOnWeb v1
- description: Firma Web Síncrona Swagger v1. Conjunt d'operacions REST de PortaFIB
    per gestionar peticions de firma a través de web de forma síncrona (també anomenada
    immediata o directa).
  name: DirectSignatureOnWeb v1
- description: Plantilla de Flux de Firma Swagger v1. API Interna de PortaFIB que
    ofereix operacions CRUD (web i no web) sobre Plantilles de Flux de Firmes.
  name: SignatureFlowTemplate v1
- description: Firma Server Swagger v1. API Interna de PortaFIB que ofereix serveis
    de firma en servidor.
  name: SignatureOnServer v1
- description: Firma Validació Swagger v1.API Interna de PortaFIB que ofereix serveis
    de validació de firmes.
  name: SignatureValidation v1
paths:
  /secure/asyncsignatureonweb/v1/createAndStartSignatureRequestWithFlowTemplateCode:
    post:
      operationId: createAndStartSignatureRequestWithFlowTemplateCode
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignatureRequestWithFlowTemplateCode'
        description: Informació de la Petició de Firma a crear.
      responses:
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestExceptionInfo'
          description: Paràmetres incorrectes
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestExceptionInfo'
          description: No Autenticat
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestExceptionInfo'
          description: No autoritzat
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataConstants'
          description: Error no controlat
        "200":
          content:
            application/json:
              schema:
                format: int64
                type: integer
          description: Operació realitzada correctament
      security:
      - BasicAuth: []
      summary: Crea i posa en marxa una Petició de Firma a partir d'una codi de Plantilla
        de Flux de Firmes previament creada al servidor
      tags:
      - AsyncSignatureOnWeb v1
      x-content-type: application/json
      x-accepts:
      - application/json
