components:
  schemas:
    RestExceptionInfo:
      description: Estructura de dades utilitzada per passar informació d'un error
      example:
        field: field
        errorMessage: errorMessage
        stackTraceCause: stackTraceCause
        errorCode: 0
        stackTrace: stackTrace
      properties:
        errorCode:
          description: Codi intern de l'error. Si l'Aplicació no gestiona codis d'error
            llavors val null.
          format: int32
          type: integer
        errorMessage:
          description: Missatge de l'error
          type: string
        stackTrace:
          description: Stacktrace de l'excepció
          type: string
        stackTraceCause:
          description: Stacktrace de l'excepció causant de l'error si n'hi hagués.
          type: string
        field:
          description: Indica el camp en que hi ha un error de validació.
          type: string
      required:
      - errorMessage
      type: object
    AddFileToSignRequest:
      example:
        fileInfoSignature:
          reason: Exemple de firma
          additionalInformation: ca
          expedientNom: ca
          languageSign: ca
          documentType: 0
          signID: "1"
          expedientCodi: ca
          procedimentCodi: ca
          procedimentNom: ca
          signNumber: 1
          fileToSign:
            data: data
            mime: mime
            nom: nom
          name: test.pdf
          location: Palma
          previusSignatureDetachedFile:
            data: data
            mime: mime
            nom: nom
          expedientUrl: ca
        transactionID: transactionID
      properties:
        transactionID:
          description: Identificador de transacció
          type: string
        fileInfoSignature:
          $ref: '#/components/schemas/FileInfoSignature'
      required:
      - fileInfoSignature
      - transactionID
      type: object
    Document:
      description: Objecte que representa un Document/Fitxer
      example:
        data: data
        mime: mime
        nom: nom
      properties:
        nom:
          description: Nom del fitxer.
          type: string
        mime:
          description: Tipus mime del fitxer.
          type: string
        data:
          description: Contingut del fitxer. En llistats aquest camp vendrà buit.
          format: byte
          type: string
      required:
      - nom
      type: object
    FileInfoSignature:
