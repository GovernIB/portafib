      description: Objecte per afegir una annex a la Petició de firma. Actualment
        només s'accepten combinacions de (attch=true i sign=true) o (attch=false i
        sign=false).
      example:
        sign: true
        attach: true
        annex:
          data: data
          mime: mime
          name: name
      properties:
        annex:
          $ref: '#/components/schemas/Document'
        attach:
          description: Indica si s'ha d'adjuntar al PDF
          type: boolean
        sign:
          description: Indica si s'ha de signar també l'annex
          type: boolean
      required:
      - annex
      - attach
      - sign
      type: object
    Document:
      description: Objecte que representa un Document/Fitxer
      example:
        data: data
        mime: mime
        name: name
      properties:
        name:
          description: Nom del fitxer.
          type: string
        mime:
          description: Tipus mime del fitxer.
          type: string
        data:
          description: Contingut del fitxer. En llistats aquest camp vendrà buit.
          format: byte
          type: string
      required:
      - name
      type: object
    Metadata:
      description: Conté informació i valor d'una Metadada
      example:
        name: name
        description: description
        type: 5
        value: value
      properties:
        name:
          description: Nom de la metadada
          type: string
        value:
          description: Valor de la metadada
          type: string
        description:
          description: Descripció de la metadada
          type: string
        type:
          description: "Format del valor de la metadada. Per defecte es considera\
            \ un Sring. Els valors disponibles són:\r\n    • MetadataConstants.STRING.getValue()\
            \ = 0; \r\n    • MetadataConstants.INTEGER.getValue() = 1;\r\n    • MetadataConstants.\
            \ DECIMAL.getValue() = 2;\r\n    • MetadataConstants.BOOLEAN.getValue()\
            \ = 3;\r\n    • MetadataConstants.BASE64.getValue() = 4;\r\n    • MetadataConstants.DATE.getValue()\
            \ = 5; // ISO8601"
